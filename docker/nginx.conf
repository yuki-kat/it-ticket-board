# Serves the single-file board and passes /api to the Express server, so both share one address
# (the built page calls /api on its own origin, so no VITE_API_URL or CORS setup is needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Matrix uploads are capped at 10 MB by the API; leave headroom so the API, not nginx, answers
  # an oversized file with its own "File is larger than 10 MB" message.
  client_max_body_size 12m;

  # Same headers as the Render static site (render.yaml).
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # AI suggestions can take up to about a minute.
    proxy_read_timeout 90s;
  }

  location = /health {
    proxy_pass http://api:3001/health;
  }
}
