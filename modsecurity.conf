# ModSecurity configuration for IT Ticket Board
# Deploy: sudo cp modsecurity.conf /etc/modsecurity/modsecurity.conf
#         sudo systemctl restart nginx

# Engine mode: DetectionOnly (log only) | On (block)
SecRuleEngine On

# Audit logging
SecAuditEngine On
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogFormat JSON
SecAuditLogType Serial

# Request/response limits
SecRequestBodyLimit 10485760
SecRequestBodyNoFiles 131072
SecRequestBodyInMemoryLimit 262144

# Arguments separator (standard for web apps)
SecArgumentSeparator &

# Cookie handling
SecCookieFormat 0

# Temp directory for ModSecurity
SecTmpDir /var/tmp/modsecurity/
SecDataDir /var/tmp/modsecurity/

# ============ OWASP CRS Rules ============
# Load CRS setup
Include /usr/share/modsecurity-crs/crs-setup.conf

# Paranoia level: 1 (default) to 4 (strictest)
# Level 1: Minimal FP, catches common attacks
# Level 2-4: More aggressive, may cause FP on legitimate requests
SecCRSsetParanoidaLevel 1

# Load all CRS rules
Include /usr/share/modsecurity-crs/rules/*.conf

# ============ App-specific exemptions ============
# File upload endpoints (adjust as needed)
SecRule REQUEST_URI "@beginsWith /api/escalation-matrix/upload" \
    "id:1001,phase:1,pass,nolog,ctl:RuleEngine=Off"

# Allow large JSON payloads for bulk operations
SecRule REQUEST_METHOD "@streq POST" \
    "id:1002,phase:1,pass,nolog,setvar:tx.max_body_size=10485760"

# ============ Custom rules ============

# Block requests with suspicious patterns
SecRule ARGS|HEADERS|REQUEST_COOKIES "@rx (?:union|select|insert|update|delete|drop|create|alter)" \
    "id:2001,phase:2,deny,status:403,log,msg:'SQL injection attempt detected'"

# Rate limiting (basic)
SecRule IP:@withinRange 127.0.0.1 \
    "id:2002,phase:1,pass,nolog"

# Block common web shells
SecRule FILES_NAMES "@rx (?:shell|cmd|exec|system|passthru|eval)" \
    "id:2003,phase:2,deny,status:403,log,msg:'Web shell upload attempt blocked'"

# Log all blocked requests
SecAction "id:9000,phase:5,pass,nolog,setenv:blockedtraffic=1"

# Return 403 for blocked requests
SecDefaultAction "phase:1,deny,status:403,log"
SecDefaultAction "phase:2,deny,status:403,log"
