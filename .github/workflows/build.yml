name: Build desktop app

# Run by hand: Actions tab -> Build desktop app -> Run workflow.
# Each build makes about 300 MB of installers, so it does not run on every change,
# and the installers are deleted after 7 days to stay inside GitHub's storage limit.
on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: desktop

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
