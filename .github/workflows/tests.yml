name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            app/package-lock.json
      - name: Build the page from the React source (app/)
        working-directory: app
        run: |
          npm ci
          npm run build:page
      - name: Check that index.html is up to date with the source
        working-directory: .
        run: |
          if ! git diff --exit-code --stat -- index.html; then
            echo "First differing chunk:"
            git diff -U1 -- index.html | head -c 3000
            echo "::error file=index.html::index.html does not match the source in app/. Run 'npm run build:page' in app/ and commit the result."
            exit 1
          fi
      - name: Upload the rebuilt page for comparison
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-index
          path: index.html
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore

  # API tests against a throwaway Postgres that GitHub starts for this run (free on public repos).
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticketboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ticketboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Create the tables (same migration Render runs before start)
        run: npm run migrate
      - name: API tests
        run: npm test
