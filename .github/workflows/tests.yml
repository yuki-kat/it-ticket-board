name: Browser tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tests/package-lock.json
            app/package-lock.json
      - name: Build the page from the React source (app/)
        working-directory: app
        run: |
          npm ci
          npm run build:page
      - name: Check that index.html is up to date with the source
        working-directory: .
        run: |
          if ! git diff --exit-code --stat -- index.html; then
            echo "::error file=index.html::index.html does not match the source in app/. Run 'npm run build:page' in app/ and commit the result."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          if-no-files-found: ignore
