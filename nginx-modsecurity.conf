# Nginx + ModSecurity WAF configuration for IT Ticket Board
# Install: sudo apt-get install -y libnginx-mod-http-modsecurity modsecurity-crs nginx
# Deploy: sudo cp nginx-modsecurity.conf /etc/nginx/sites-available/it-ticket-board
#         sudo ln -s /etc/nginx/sites-available/it-ticket-board /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl restart nginx

load_module modules/ngx_http_modsecurity_module.so;

upstream node_app {
    server localhost:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # ============ ModSecurity WAF ============
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

    # ============ Security Headers ============
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

    # ============ Proxy to Node app ============
    location / {
        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # ============ Deny suspicious paths ============
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.well-known {
        allow all;
    }

    location ~ /\.git {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /node_modules {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ============ Logging ============
    access_log /var/log/nginx/it-ticket-board-access.log;
    error_log /var/log/nginx/it-ticket-board-error.log warn;
}
