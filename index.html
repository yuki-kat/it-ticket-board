    <script>
      (() => {
        const key = 'ops-kanban-debug-v1';
        const on = () => /[?&]debug\b/.test(location.search) || localStorage.getItem(key) === '1';
        const log = [];
        let panel = null;
        const describe = (el) => {
          if (!el || !el.tagName) return String(el);
          const cls = typeof el.className === 'string' && el.className.trim() ? '.' + el.className.trim().split(/\s+/).join('.') : '';
          const text = (el.getAttribute('aria-label') || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40);
          return `${el.tagName.toLowerCase()}${cls}${text ? ` "${text}"` : ''}`;
        };
        const render = () => {
          if (!panel) return;
          panel.querySelector('ol').innerHTML = log.map((entry) => `<li class="${entry.kind}"><time>${entry.time}</time><b>${entry.kind}</b><span></span></li>`).join('');
          panel.querySelectorAll('li span').forEach((span, index) => { span.textContent = log[index].detail; });
          panel.querySelector('ol').scrollTop = 1e9;
        };
        const add = (kind, detail) => {
          const time = new Date().toLocaleTimeString([], { hour12: false }) + '.' + String(Date.now() % 1000).padStart(3, '0');
          log.push({ kind, detail, time });
          if (log.length > 80) log.shift();
          console.debug(`[debug] ${kind}: ${detail}`);
          render();
        };
        const show = () => {
          if (panel) return;
          if (!document.getElementById('ops-debug-style')) {
            const style = document.createElement('style');
            style.id = 'ops-debug-style';
            style.textContent = '.ops-debug{position:fixed;z-index:5000;left:12px;bottom:12px;display:flex;flex-direction:column;width:min(460px,calc(100vw - 24px));max-height:42vh;border:1px solid #33505c;border-radius:10px;background:#0f1f27;color:#d4e4ea;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 18px 50px rgb(0 0 0 / 40%)}.ops-debug header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #26414c}.ops-debug header strong{flex:1;color:#fff}.ops-debug header button{padding:3px 8px;border:1px solid #3d5c68;border-radius:5px;background:#18313c;color:#d4e4ea;font:inherit;cursor:pointer}.ops-debug ol{margin:0;padding:6px 10px;overflow:auto;list-style:none}.ops-debug li{display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:2px 0;border-bottom:1px solid #1b313b}.ops-debug time{color:#6f8c97}.ops-debug b{color:#8cc7d8}.ops-debug li.popup b{color:#e5c07b}.ops-debug li.page b{color:#98c379}.ops-debug li.error b{color:#ef7b72}.ops-debug li.error span{color:#f3b1ab}.ops-debug span{overflow-wrap:anywhere}';
            document.head.appendChild(style);
          }
          panel = document.createElement('section');
          panel.className = 'ops-debug';
          panel.setAttribute('aria-label', 'Debug log');
          panel.innerHTML = '<header><strong>Debug log</strong><button type="button" data-act="clear">Clear</button><button type="button" data-act="off">Turn off</button></header><ol></ol>';
          panel.addEventListener('click', (event) => {
            const act = event.target.closest('button')?.dataset.act;
            if (act === 'clear') { log.length = 0; render(); }
            if (act === 'off') toggle(false);
          });
          document.body.appendChild(panel);
          render();
        };
        const toggle = (value) => {
          localStorage.setItem(key, value ? '1' : '0');
          if (value) { show(); add('debug', 'on (Ctrl+Shift+D toggles)'); } else { panel?.remove(); panel = null; }
        };
        const active = () => !!panel;
        window.addEventListener('click', (event) => {
          if (!active() || event.target.closest?.('.ops-debug')) return;
          add('click', `${describe(event.target)}${event.isTrusted ? '' : ' (scripted)'}`);
        }, true);
        window.addEventListener('keydown', (event) => {
          if (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 'd') { event.preventDefault(); toggle(!active()); }
        });
        window.addEventListener('error', (event) => { if (active()) add('error', `${event.message} (${(event.filename || '').split('/').pop()}:${event.lineno}:${event.colno})`); });
        window.addEventListener('unhandledrejection', (event) => { if (active()) add('error', `Unhandled promise: ${event.reason?.message || event.reason}`); });
        const isPopup = (node) => node.nodeType === 1 && !node.closest?.('.ops-debug') && (node.matches('[role="dialog"], .overlay, [class*="overlay"], [class*="popout"]') || node.querySelector?.(':scope > [role="dialog"]'));
        const popupName = (node) => (node.querySelector?.('h2, h3')?.textContent || describe(node)).trim().slice(0, 50);
        let lastPage = '';
        new MutationObserver((mutations) => {
          if (!active()) return;
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => { if (isPopup(node)) add('popup', `opened: ${popupName(node)}`); });
            mutation.removedNodes.forEach((node) => { if (isPopup(node)) add('popup', `closed: ${popupName(node)}`); });
          });
          const page = document.querySelector('.primary-nav button.active')?.textContent.trim() || '';
          if (page && page !== lastPage) { if (lastPage) add('page', `${lastPage} → ${page}`); lastPage = page; }
        }).observe(document.body, { childList: true, subtree: true });
        if (on()) toggle(true);
      })();
    </script>

    <script>
      (() => {
        const applyDeviceHealth = () => {
          document.querySelectorAll('.inventory-table thead th').forEach((heading) => {
            if (heading.textContent.trim() === 'Health') heading.textContent = 'Device health';
          });

          document.querySelectorAll('.inventory-health-filter, label select').forEach((select) => {
            const label = select.closest('label');
            const isHealthSelect = select.classList.contains('inventory-health-filter') || (label && label.textContent.trim().startsWith('Device health'));
            if (!isHealthSelect) return;

            Array.from(select.options).forEach((option) => {
              if (option.textContent === 'Needs attention') option.textContent = 'At Risk';
              if (option.textContent === 'Offline') option.textContent = 'Critical';
            });

            if (!Array.from(select.options).some((option) => option.textContent === 'Monitor')) {
              const monitor = document.createElement('option');
              monitor.value = 'Monitor';
              monitor.textContent = 'Monitor';
              const atRisk = Array.from(select.options).find((option) => option.textContent === 'At Risk');
              select.insertBefore(monitor, atRisk || null);
            }
          });

          document.querySelectorAll('.inventory-health-badge').forEach((badge) => {
            const row = badge.closest('tr');
            const original = badge.dataset.action1Base || badge.textContent.trim();
            let baseHealth = original;

            if (original === 'Needs attention') baseHealth = 'At Risk';
            if (original === 'Offline') baseHealth = 'Critical';
            if (original === 'Healthy' && row && row.querySelector('.warranty-soon')) baseHealth = 'Monitor';
            badge.dataset.action1Base = baseHealth;
            const health = baseHealth;

            badge.textContent = health;
            badge.classList.remove('healthy', 'needs-attention', 'offline', 'monitor', 'at-risk', 'critical');
            badge.classList.add(health.toLowerCase().replace(/\s+/g, '-'));
            badge.setAttribute('title', health === 'Healthy'
              ? 'Device is operating normally'
              : health === 'Monitor'
                ? 'Device is healthy but needs observation'
                : health === 'At Risk'
                  ? 'Device needs service attention'
                  : 'Device is offline, lost, or severely impaired');
          });

          document.querySelectorAll('.inventory-list-caption').forEach((caption) => {
            if (caption.querySelector('.device-health-legend') || !caption.closest('[aria-label="Asset list"]')) return;
            const legend = document.createElement('div');
            legend.className = 'device-health-legend';
            legend.setAttribute('aria-label', 'Device health levels');
            legend.innerHTML = '<span><i></i>Healthy</span><span class="monitor"><i></i>Monitor</span><span class="at-risk"><i></i>At Risk</span><span class="critical"><i></i>Critical</span>';
            caption.appendChild(legend);
          });

        };

        let scheduled = false;
        const schedule = () => {
          if (scheduled) return;
          scheduled = true;
          requestAnimationFrame(() => {
            scheduled = false;
            applyDeviceHealth();
          });
        };

        new MutationObserver(schedule).observe(document.getElementById('root'), { childList: true, subtree: true });
        schedule();
      })();
    </script>
  
    <script>

<style>

  .insight-detail-tickets{margin-top:16px;padding:14px 16px;border:1px solid #dce7ea;border-radius:10px;background:#fff}.insight-detail-tickets:empty{display:none}.insight-detail-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}.insight-detail-head strong{color:#294754;font-size:13px}.insight-detail-head span{color:#7a8f98;font-size:10px}.insight-detail-tickets ul{display:grid;gap:4px;margin:0;padding:0;list-style:none}.insight-detail-tickets li button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border:1px solid transparent;border-radius:7px;background:none;color:#365662;text-align:left;cursor:pointer}.insight-detail-tickets li button:hover{border-color:#cfe0e5;background:#f3f9fa}.insight-detail-tickets li button:focus-visible{outline:2px solid #4d91a3}.insight-detail-tickets li i{flex:none;width:8px;height:8px;border-radius:50%;background:#8aa4ad}.insight-detail-tickets li i.p1{background:#db6763}.insight-detail-tickets li i.p2{background:#e0a64a}.insight-detail-tickets li i.p3{background:#4d91a3}.insight-detail-tickets li i.p4{background:#9aaab0}.insight-detail-tickets li span{flex:1;min-width:0}.insight-detail-tickets li b{display:block;overflow:hidden;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.insight-detail-tickets li small{display:block;margin-top:2px;color:#7f939b;font-size:9px}.insight-detail-tickets li em{flex:none;color:#2f7186;font-size:10px;font-style:normal;font-weight:700}.insight-detail-more,.insight-detail-empty{margin:8px 0 0;color:#7a8f98;font-size:10px}
  .insight-detail-dialog .ticket-card-popout-actions{align-items:center}.insight-detail-arrange{margin-right:auto;border:1px dashed #b9cfd6;background:#f4f9fa;color:#3d6878}
</style>
<script>
  (()=>{const ticketKey='it-ticket-kanban-v1';const tickets=()=>{try{const list=JSON.parse(localStorage.getItem(ticketKey)||'[]');return Array.isArray(list)?list:[]}catch{return[]}};const isOpen=ticket=>ticket.status!=='Resolved';const queueLabels={all:'Open all tickets',active:'Open active tickets','high-priority':'Open P1 / P2 tickets',overdue:'Open past-SLA tickets',escalated:'Open escalated tickets','escalation-due':'Open escalation-due tickets',unassigned:'Open unassigned tickets',waiting:'Open waiting-on-user tickets',resolved:'Open closed tickets'};const queueSources={active:['.home-kpi-grid .home-kpi','open tickets'],resolved:['.home-kpi-grid .home-kpi','closed tickets'],'high-priority':['.home-kpi-grid .home-kpi','p1 / p2 open'],overdue:['.home-kpi-grid .home-kpi','past resolution sla'],escalated:['.home-action-strip button','escalated'],'escalation-due':['.home-action-strip button','escalation due'],waiting:['.home-action-strip button','waiting on user'],unassigned:['.home-action-strip button','unassigned'],all:['.home-recent-card .home-chart-heading button','see all']};
  /* Call the Home button's own React handler so the card-popup click interceptors don't catch the handoff. */
  const reactClick=el=>{const key=Object.keys(el).find(k=>k.startsWith('__reactProps$'));const handler=key&&el[key].onClick;if(!handler)return false;handler({preventDefault(){},stopPropagation(){},currentTarget:el,target:el});return true};const openQueue=queue=>{const[selector,label]=queueSources[queue]||queueSources.all;const source=Array.from(document.querySelectorAll(selector)).find(el=>el.textContent.trim().toLowerCase().startsWith(label));if(source&&reactClick(source))return;document.querySelectorAll('.primary-nav button')[1]?.click()};const openTicket=id=>{close();openQueue('all');let tries=0;const fill=()=>{const input=document.querySelector('input[aria-label="Search tickets, people, tags"]');if(!input){if(++tries<40)setTimeout(fill,25);return}Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(input,id);input.dispatchEvent(new Event('input',{bubbles:true}));input.focus()};fill()};
  const configs={'Tickets by state':{rows:'.home-status-bars .home-status-row',hint:'Select a state to list its tickets.',queue:'all',segment:row=>{const status=row.querySelector('span')?.textContent.trim()||'';return{label:status,queue:{'Waiting on User':'waiting',Escalated:'escalated',Resolved:'resolved'}[status]||'active',match:ticket=>ticket.status===status}}},'Open tickets by priority':{rows:'.home-priority-legend > div',hint:'Select a priority to list its open tickets.',queue:'active',segment:row=>{const priority=row.querySelector('span')?.textContent.trim()||'';return{label:`${priority} open tickets`,queue:/^P[12]$/.test(priority)?'high-priority':'active',match:ticket=>isOpen(ticket)&&String(ticket.severity||'').startsWith(priority)}}},'Ticket intake':{whole:{label:'Created in the last 24 hours',queue:'all',match:ticket=>Date.now()-new Date(ticket.createdAt).getTime()<=864e5}},sla:{whole:{label:'Past resolution SLA',queue:'overdue',note:'SLA breaches are calculated by the ticket board. Open the queue to see which tickets are past their target.'}},escalation:{whole:{label:'Escalated open tickets',queue:'escalated',match:ticket=>isOpen(ticket)&&ticket.status==='Escalated'}},assignment:{whole:{label:'Unassigned open tickets',queue:'unassigned',match:ticket=>isOpen(ticket)&&!String(ticket.assignee||'').trim()}},resolution:{whole:{label:'Resolved tickets',queue:'resolved',match:ticket=>ticket.status==='Resolved'}},'Recently created':{whole:{label:'Newest tickets',queue:'all',match:()=>true,newest:true}}};
  let returnFocus=null;const close=()=>{const overlay=document.querySelector('.insight-detail-overlay');if(!overlay)return;overlay.remove();returnFocus?.focus?.();returnFocus=null};const ticketRow=ticket=>{const item=document.createElement('li');const button=document.createElement('button');button.type='button';const dot=document.createElement('i');dot.className=(String(ticket.severity||'').match(/^P[1-4]/)?.[0]||'').toLowerCase();const copy=document.createElement('span');const title=document.createElement('b');title.textContent=ticket.title||'Untitled ticket';const meta=document.createElement('small');meta.textContent=[ticket.id,ticket.status,String(ticket.severity||'').split(/\s+/)[0],ticket.assignee||'Unassigned'].filter(Boolean).join(' · ');copy.append(title,meta);const go=document.createElement('em');go.textContent='Open';button.append(dot,copy,go);button.addEventListener('click',()=>openTicket(ticket.id));item.appendChild(button);return item};const showTickets=(overlay,segment)=>{const box=overlay.querySelector('.insight-detail-tickets');box.replaceChildren();const primary=overlay.querySelector('.ticket-card-popout-open');primary.textContent=queueLabels[segment.queue];primary.dataset.queue=segment.queue;const head=document.createElement('div');head.className='insight-detail-head';const name=document.createElement('strong');name.textContent=segment.label;head.appendChild(name);box.appendChild(head);if(!segment.match){const note=document.createElement('p');note.className='insight-detail-empty';note.textContent=segment.note||'';box.appendChild(note);return}const matches=tickets().filter(segment.match).sort((a,b)=>(segment.newest?0:String(a.severity).localeCompare(String(b.severity)))||new Date(b.createdAt)-new Date(a.createdAt));const count=document.createElement('span');count.textContent=`${matches.length} ticket${matches.length===1?'':'s'}`;head.appendChild(count);if(!matches.length){const empty=document.createElement('p');empty.className='insight-detail-empty';empty.textContent='No tickets match right now.';box.appendChild(empty);return}const list=document.createElement('ul');matches.slice(0,6).forEach(ticket=>list.appendChild(ticketRow(ticket)));box.appendChild(list);if(matches.length>6){const more=document.createElement('p');more.className='insight-detail-more';more.textContent=`+${matches.length-6} more. Use “${queueLabels[segment.queue]}” to see the full list.`;box.appendChild(more)}};
  const open=card=>{if(document.querySelector('.ticket-card-popout'))return;returnFocus=document.activeElement;const key=card.dataset.extraInsight||card.querySelector('h3')?.textContent.trim()||'';const config=configs[key]||{whole:{label:card.querySelector('h3')?.textContent.trim()||'Insight',queue:'all'}};const overlay=document.createElement('div');overlay.className='ticket-card-popout insight-detail-overlay';overlay.innerHTML='<section class="ticket-card-popout-dialog insight-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="insight-detail-title" tabindex="-1"><button class="ticket-card-popout-close" type="button" aria-label="Close popup">×</button><div class="eyebrow">OPERATIONS INSIGHTS</div><h2 id="insight-detail-title"></h2><p></p><div class="ticket-card-popout-preview insight-detail-preview"></div><div class="insight-detail-tickets" aria-live="polite"></div><div class="ticket-card-popout-actions"><button class="insight-detail-arrange" type="button">Arrange card</button><button class="ticket-card-popout-cancel" type="button">Close</button><button class="ticket-card-popout-open" type="button"></button></div></section>';overlay.querySelector('h2').textContent=card.querySelector('h3')?.textContent.trim()||'Insight';overlay.querySelector('.insight-detail-dialog>p').textContent=card.querySelector('.home-chart-heading p')?.textContent.trim()||'';const clone=card.cloneNode(true);clone.querySelector('.insight-click-target')?.remove();clone.removeAttribute('draggable');overlay.querySelector('.insight-detail-preview').appendChild(clone);const primary=overlay.querySelector('.ticket-card-popout-open');primary.textContent=queueLabels[config.queue||'all'];primary.dataset.queue=config.queue||'all';if(config.rows){const rows=Array.from(clone.querySelectorAll(config.rows));rows.forEach(row=>{const segment=config.segment(row);row.classList.add('insight-segment');row.setAttribute('role','button');row.setAttribute('tabindex','0');row.setAttribute('aria-pressed','false');row.setAttribute('aria-label',`${segment.label}: show tickets`);const select=()=>{rows.forEach(other=>other.setAttribute('aria-pressed',String(other===row)));showTickets(overlay,segment)};row.addEventListener('click',select);row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select()}})});const hint=document.createElement('p');hint.className='insight-detail-hint';hint.textContent=config.hint;overlay.querySelector('.insight-detail-preview').appendChild(hint)}else if(config.whole)showTickets(overlay,config.whole);primary.addEventListener('click',()=>{const queue=primary.dataset.queue;close();openQueue(queue)});overlay.querySelector('.insight-detail-arrange').addEventListener('click',()=>{close();card.dispatchEvent(new CustomEvent('insight-arrange',{bubbles:true}))});overlay.querySelector('.ticket-card-popout-close').addEventListener('click',close);overlay.querySelector('.ticket-card-popout-cancel').addEventListener('click',close);overlay.addEventListener('mousedown',event=>{if(event.target===overlay)close()});document.body.appendChild(overlay);overlay.querySelector('[role="dialog"]').focus()};document.addEventListener('insight-open',event=>open(event.target));window.addEventListener('keydown',event=>{if(event.key==='Escape')close()},true)})();
</script>
</html>
