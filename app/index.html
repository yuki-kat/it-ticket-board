<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f4" />
    <meta name="artifact-format" content="self-contained-html" />
    <meta name="description" content="A lightweight IT service desk Kanban board with escalation matrix reference." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>IT Ticket Board</title>
    <!-- Loading screen. It sits inside #root, so React replaces it on its first render; nothing has to hide it.
         Kept small and first in the page so it shows while the app's script and styles are still arriving. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: #f3f6f8; color: #18384e; font: 14px 'Aptos', 'Segoe UI', Arial, sans-serif; }
      .boot-inner { display: grid; justify-items: center; gap: 14px; text-align: center; }
      .boot-brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; letter-spacing: .14em; }
      .boot-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #e3eef1; color: #2b6072; }
      .boot-bar { position: relative; width: 168px; height: 3px; overflow: hidden; border-radius: 3px; background: #dbe6e9; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #2b6072; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-label { margin: 0; color: #62808e; font-size: 12px; }
      .boot-slow { max-width: 280px; margin: 0; color: #62808e; font-size: 12px; line-height: 1.5; opacity: 0; animation: boot-show .3s ease 12s forwards; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { width: 100%; opacity: .45; animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-inner">
          <div class="boot-brand"><span class="boot-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg></span>OPS KANBAN</div>
          <div class="boot-bar" aria-hidden="true"></div>
          <p class="boot-label">Loading your board…</p>
          <p class="boot-slow">Still loading. If this doesn’t go away, refresh the page.</p>
        </div>
      </div>
    </div>
    <noscript><p style="font: 14px Arial, sans-serif; padding: 16px; text-align: center;">The ticket board needs JavaScript. Turn it on for this page and reload.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
