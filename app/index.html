<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="artifact-format" content="self-contained-html" />
    <meta name="description" content="A lightweight IT service desk Kanban board with escalation matrix reference." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Binboard</title>
    <!-- Loading screen. It sits inside #root, so React replaces it on its first render; nothing has to hide it.
         Kept small and first in the page so it shows while the app's script and styles are still arriving. -->
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: #f5f5f5; color: rgba(0, 0, 0, .87); font: 14px Roboto, Helvetica, Arial, sans-serif; }
      .boot-inner { display: grid; justify-items: center; gap: 14px; text-align: center; }
      .boot-brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 400; letter-spacing: -0.5px; }
      .boot-brand b { font-weight: 700; }
      .boot-bar { position: relative; width: 168px; height: 4px; overflow: hidden; border-radius: 2px; background: rgba(25, 118, 210, .2); }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #1976d2; animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-label { margin: 0; color: rgba(0, 0, 0, .6); font-size: 13px; }
      .boot-slow { max-width: 280px; margin: 0; color: rgba(0, 0, 0, .6); font-size: 12px; line-height: 1.5; opacity: 0; animation: boot-show .3s ease 12s forwards; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @keyframes boot-show { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { width: 100%; opacity: .45; animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-inner">
          <div class="boot-brand"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="8" fill="#1976d2" /><rect x="11" y="11" width="12" height="42" rx="3" fill="#fff" fill-opacity=".25" /><rect x="26" y="11" width="12" height="42" rx="3" fill="#fff" fill-opacity=".25" /><rect x="41" y="11" width="12" height="42" rx="3" fill="#fff" fill-opacity=".25" /><rect x="13" y="15" width="8" height="7" rx="1.5" fill="#fff" /><rect x="13" y="26" width="8" height="7" rx="1.5" fill="#fff" /><rect x="13" y="37" width="8" height="7" rx="1.5" fill="#fff" /><rect x="28" y="15" width="8" height="7" rx="1.5" fill="#fff" /><rect x="28" y="26" width="8" height="7" rx="1.5" fill="#fff" /><rect x="43" y="15" width="8" height="7" rx="1.5" fill="#fff" /></svg><span><b>Bin</b>board</span></div>
          <div class="boot-bar" aria-hidden="true"></div>
          <p class="boot-label">Loading your board…</p>
          <p class="boot-slow">Still loading. If this doesn’t go away, refresh the page.</p>
        </div>
      </div>
    </div>
    <noscript><p style="font: 14px Arial, sans-serif; padding: 16px; text-align: center;">The ticket board needs JavaScript. Turn it on for this page and reload.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
