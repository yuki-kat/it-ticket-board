# Hosted mode on your own machine or server: Postgres, the Express API and the board on one address.
#   cp .env.example .env        # then fill in POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up -d --build
#   open http://localhost:8080   (sign in from Tools → Sign in)
name: ops-kanban

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_board
      POSTGRES_USER: ticket_board
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_board -d ticket_board"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: only the api service can reach the database.

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ticket_board:${POSTGRES_PASSWORD}@db:5432/ticket_board
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      AI_KEYS_SECRET: ${AI_KEYS_SECRET:-}
      AI_ALLOW_PRIVATE_ENDPOINTS: ${AI_ALLOW_PRIVATE_ENDPOINTS:-false}
      LOG_LEVEL: info

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 127.0.0.1 keeps the board on this machine. Set WEB_BIND=0.0.0.0 to reach it from your network,
      # ideally behind a reverse proxy that adds HTTPS.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db-data:
