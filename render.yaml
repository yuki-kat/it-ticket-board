services:
  - type: web
    name: it-ticket-board-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm ci --include=dev && npm run build
    startCommand: cd server && npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      # The database is on Neon's free plan (Render's free Postgres expires after 30 days).
      # Paste Neon's direct connection string (with ?sslmode=require) in the Render dashboard.
      # sync: false means Blueprint syncs leave that value alone.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 24h
      - key: CORS_ORIGIN
        value: https://it-ticket-board-frontend.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_KEYS_SECRET
        sync: false

  - type: web
    name: it-ticket-board-frontend
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    headers:
      # Security headers for the static frontend
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    envVars:
      - key: VITE_API_URL
        value: https://it-ticket-board-backend.onrender.com

# The old Render database. Nothing uses it once DATABASE_URL points at Neon; it stays listed only until
# its data has been copied to Neon. Then remove this block and delete the database in the dashboard.
databases:
  - name: postgres
    databaseName: ticket_board_db
    plan: free
    postgresMajorVersion: "16"
