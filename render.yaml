services:
  - type: web
    name: it-ticket-board-backend
    runtime: node
    plan: free
    buildCommand: cd server && npm ci && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 24h
      - key: CORS_ORIGIN
        value: https://it-ticket-board.onrender.com
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: it-ticket-board-frontend
    runtime: static
    plan: free
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: app/dist
    envVars:
      - key: VITE_GEMINI_API_KEY
        sync: false

databases:
  - name: postgres
    databaseName: ticket_board_db
    plan: free
    version: 15
